<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>一封语音信</title>
<style>
  :root{
    --ink:#2f2a26;
    --ink-soft:#6b6157;
    --paper:#f7f2e8;
    --paper-2:#fffdf8;
    --line:#e2d8c6;
    --accent:#9a6b4f;
    --warn:#b4553f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%, #fffdf8 0%, #f7f2e8 45%, #efe6d6 100%);
    display:flex;justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    min-height:100%;
  }
  .card{
    width:100%;max-width:420px;align-self:center;
    background:linear-gradient(180deg,var(--paper-2),var(--paper));
    border:1px solid var(--line);border-radius:18px;
    padding:34px 26px 28px;
    box-shadow:0 1px 0 #fff inset, 0 18px 40px -24px rgba(80,60,40,.55);
  }
  .hide{display:none !important}
  .seal{
    width:46px;height:46px;margin:0 auto 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--accent);border:1px solid var(--line);background:#fffdf8;
  }
  h1{
    font-family:"Songti SC","Source Han Serif SC","Noto Serif SC",SimSun,serif;
    font-size:25px;font-weight:600;letter-spacing:.06em;text-align:center;margin:0 0 6px;
  }
  .sub{text-align:center;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;margin:0 0 22px}
  .rule{display:flex;align-items:center;gap:12px;margin:0 0 22px}
  .rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
  .rule span{font-size:12px;color:var(--ink-soft);letter-spacing:.3em}

  /* ---- 口令 ---- */
  .hint{font-size:13px;line-height:1.8;color:var(--ink-soft);text-align:center;margin:0 0 20px}
  .row{display:flex;gap:10px}
  input{
    flex:1;min-width:0;
    font:inherit;font-size:16px;
    padding:12px 14px;
    color:var(--ink);background:#fffdf8;
    border:1px solid var(--line);border-radius:12px;
    outline:none;letter-spacing:.08em;
  }
  input:focus{border-color:var(--accent)}
  button{
    font:inherit;font-size:15px;
    padding:12px 18px;
    color:#fffdf8;background:var(--accent);
    border:1px solid var(--accent);border-radius:12px;
    letter-spacing:.1em;cursor:pointer;
  }
  button:active{opacity:.85}
  .err{margin:12px 0 0;font-size:13px;color:var(--warn);text-align:center;min-height:18px}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .38s}

  /* ---- 信 ---- */
  audio{width:100%;height:44px;display:block;margin:0 0 18px}
  .meta{display:flex;justify-content:center;gap:18px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;margin:0 0 22px}
  .dl{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:13px 16px;border-radius:12px;
    border:1px solid var(--line);background:#fffdf8;
    color:var(--accent);font-size:15px;font-weight:500;letter-spacing:.06em;
    text-decoration:none;
  }
  .dl:active{background:#f3ece0}
  .tip{margin:20px 0 0;font-size:12px;line-height:1.75;color:var(--ink-soft);text-align:center}
  .tip b{color:var(--ink);font-weight:600}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rise{animation:rise .5s ease-out both}
</style>
</head>
<body>

  <!-- 上锁 -->
  <div class="card" id="lock">
    <div class="seal">✉</div>
    <h1>一封语音信</h1>
    <p class="sub">写给你一个人</p>
    <div class="rule"><span>口令</span></div>
    <p class="hint">输入我告诉你的口令，就能打开。</p>
    <div class="row">
      <input id="pw" type="text" placeholder="口令" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="go">打开</button>
    </div>
    <p class="err" id="err"></p>
  </div>

  <!-- 解锁后 -->
  <main class="card hide" id="letter">
    <div class="seal">✉</div>
    <h1>一封语音信</h1>
    <p class="sub">写给你一个人</p>
    <div class="rule"><span>听</span></div>
    <audio id="audio" controls preload="metadata">
      你的浏览器不支持音频播放，请用下面的「下载音频」。
    </audio>
    <div class="meta">
      <span>时长 8:00</span><span>·</span><span>约 18 MB</span>
    </div>
    <a class="dl" id="dl" href="#" download="一封信.mp3">↓ 下载音频</a>
    <p class="tip">若无法播放或下载，点右上角 <b>···</b> → <b>在浏览器打开</b>。</p>
  </main>

<script>
(function () {
  var K   = "zQ7p";
  var ENC = "AjhZQUphDg==";
  var SRC = "y2fhpkr3.mp3";

  function dec(s) {
    var b = atob(s), o = "";
    for (var i = 0; i < b.length; i++) {
      o += "%" + ("0" + (b.charCodeAt(i) ^ K.charCodeAt(i % K.length)).toString(16)).slice(-2);
    }
    return decodeURIComponent(o);
  }
  function eq(a, b) {
    if (a.length !== b.length) return false;
    var d = 0;
    for (var i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return d === 0;
  }

  var lock   = document.getElementById("lock");
  var letter = document.getElementById("letter");
  var input  = document.getElementById("pw");
  var errEl  = document.getElementById("err");
  var opened = false;

  function open() {
    if (opened) return;
    opened = true;
    var a = document.getElementById("audio");
    a.src = SRC;
    document.getElementById("dl").setAttribute("href", SRC);
    lock.classList.add("hide");
    letter.classList.remove("hide");
    letter.classList.add("rise");
    input.blur();
    try { sessionStorage.setItem("ok", ENC); } catch (e) {}
  }

  function submit() {
    var v = input.value.trim();
    if (!v) { errEl.textContent = "还没输入口令"; return; }
    if (eq(v, dec(ENC))) { errEl.textContent = ""; open(); return; }
    errEl.textContent = "口令不对，再想想？";
    lock.classList.add("shake");
    setTimeout(function () { lock.classList.remove("shake"); }, 400);
    input.select();
  }

  document.getElementById("go").addEventListener("click", submit);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); submit(); }
  });

  // 同一会话里已解锁过就不必再输
  try {
    if (sessionStorage.getItem("ok") === ENC) open();
  } catch (e) {}
})();
</script>
</body>
</html>
