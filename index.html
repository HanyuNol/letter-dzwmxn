<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>语音信</title>
<style>
  body{
    margin:0;
    background:#fff;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.7;
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  .page{width:100%;max-width:420px}
  h1{
    font-size:19px;
    font-weight:500;
    margin:0 0 28px;
  }
  audio{width:100%;display:block;margin:0 0 16px}
  input{
    width:100%;
    font:inherit;
    padding:10px 12px;
    color:#111;
    background:#fff;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
  }
  input:focus{border-color:#888}
  button{
    width:100%;
    margin-top:10px;
    font:inherit;
    padding:10px 12px;
    color:#111;
    background:#f5f5f5;
    border:1px solid #ccc;
    border-radius:6px;
    cursor:pointer;
  }
  button:active{background:#ececec}
  .dl{
    display:block;
    text-align:center;
    padding:10px 12px;
    color:#111;
    border:1px solid #ccc;
    border-radius:6px;
    text-decoration:none;
  }
  .dl:active{background:#f5f5f5}
  .note{
    font-size:13px;
    color:#777;
    margin:20px 0 0;
  }
  .err{font-size:13px;color:#c0392b;margin:10px 0 0;min-height:18px}
  .hide{display:none}
</style>
</head>
<body>
  <div class="page">

    <div id="lock">
      <h1>语音信</h1>
      <p class="note" style="margin:0 0 14px">需要口令</p>
      <input id="pw" type="text" placeholder="口令" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="go">打开</button>
      <p class="err" id="err"></p>
    </div>

    <main id="letter" class="hide">
      <h1>语音信</h1>
      <audio id="audio" controls preload="metadata">
        你的浏览器不支持音频播放，请用下面的「下载音频」。
      </audio>
      <a class="dl" id="dl" href="#" download="一封信.mp3">下载音频</a>
      <p class="note">播放或下载不了的话，点右上角「···」→「在浏览器打开」。</p>
    </main>

  </div>

<script>
(function () {
  var K   = "zQ7p";
  var ENC = "AjhZQUphDg==";
  var SRC = "y2fhpkr3.mp3";

  // 前端解出口令原文，仅用于比对
  function dec(s) {
    var b = atob(s), o = "";
    for (var i = 0; i < b.length; i++) {
      o += "%" + ("0" + (b.charCodeAt(i) ^ K.charCodeAt(i % K.length)).toString(16)).slice(-2);
    }
    return decodeURIComponent(o);
  }
  function eq(a, b) {
    if (a.length !== b.length) return false;
    var d = 0;
    for (var i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return d === 0;
  }

  var lock   = document.getElementById("lock");
  var letter = document.getElementById("letter");
  var input  = document.getElementById("pw");
  var errEl  = document.getElementById("err");
  var opened = false;

  function open() {
    if (opened) return;
    opened = true;
    var a = document.getElementById("audio");
    a.src = SRC;
    document.getElementById("dl").setAttribute("href", SRC);
    lock.classList.add("hide");
    letter.classList.remove("hide");
    input.blur();
    try { sessionStorage.setItem("ok", ENC); } catch (e) {}
  }

  function submit() {
    var v = input.value.trim();
    if (!v) { errEl.textContent = "还没输入口令"; return; }
    if (eq(v, dec(ENC))) { errEl.textContent = ""; open(); return; }
    errEl.textContent = "口令不对";
    input.select();
  }

  document.getElementById("go").addEventListener("click", submit);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); submit(); }
  });

  // 同一会话里已经打开过，就不用再输
  try {
    if (sessionStorage.getItem("ok") === ENC) open();
  } catch (e) {}
})();
</script>
</body>
</html>
